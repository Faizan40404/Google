<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="index.css">
    <title>New Tab</title>
</head>

<body>
    <header>
        <!-- top line -->
        <span class="Top"> Gmail </span>
        <span class="Top"> Images </span>
        <div class="wrapper" title="Search Labs"> <img src="Pics/flask.png" alt="flask" class="option one"></div>
        <div class="wrapper" title="Google apps"> <img src="Pics/dots-menu.png" alt="menu" class="option two"></div>
        <div class="wrapper pf"><img
                src="	https://lh3.google.com/u/0/ogw/AF2bZyjDpYkk2Xd4rmKuDcvCXCoU6Fj2vqjGvxjd4SM5TCOMNw=s64-c-mo"
                alt="profile" class="pfp"></div>
    </header>

    <main>
        <!-- logo -->
        <div class="logo">
            <img src="Pics/Google_2015_logo.png" alt="Google logo">
        </div>
        <!-- Search -->
        <div class="form">
            <form>
                <input type="text" name="Search" id="Search" placeholder="Search Google or type a URL">
            </form>
            <img src="Pics/search.png" alt="Search" class="Search">
            <img src="Pics/google.png" alt="Search" class="Mic" title="Search by Voice">
            <img src="Pics/camera.png" alt="Search By Image" class="Camera" title="Search by Image">
        </div>
        <!-- Icons -->
        <div class="Icons">
            <a href="https://youtube.com" title="YouTube">
                <div class="pic"><img src="Pics/youtube.png" alt="YouTube Logo"></div>
                <div class="span"><span>YouTube</span></div>
            </a>
            <a href="https://chatgpt.com/" title="ChatGPT">
                <div class="pic"><img src="Pics/chatgpt.png" alt="ChatGPT Logo"></div>
                <div class="span"><span>ChatGPT</span></div>
            </a>
            <a href="https://flexstudent.nu.edu.pk/Login" title="Flex">
                <div class="pic"><img src="Pics/flex.png" alt="Flex Logo"></div>
                <div class="span"><span>Flex</span></div>
            </a>
            <a href="https://vulms.vu.edu.pk/" title="LMS">
                <div class="pic"><img src="Pics/lms.png" alt="LMS Logo"></div>
                <div class="span"><span>LMS</span></div>
            </a>
            <a href="https://facebook.com" title="Facebook">
                <div class="pic"><img src="Pics/facebook.png" alt="Facebook Logo"></div>
                <div class="span"><span>Facebook</span></div>
            </a>
            <a href="https://x.com" title="X">
                <div class="pic"><img src="Pics/x.png" alt="X Logo"></div>
                <div class="span"><span>X</span></div>
            </a>
            <a href="https://chat.deepseek.com/" title="DeepSeek">
                <div class="pic"><img src="Pics/deepseek.png" alt="DeepSeek Logo"></div>
                <div class="span"><span>DeepSeek</span></div>
            </a>
            <a href="https://grok.com/" title="Grok">
                <div class="pic"><img src="Pics/grok.png" alt="Grok Logo"></div>
                <div class="span"><span>Grok</span></div>
            </a>
            <div class="add" title="Add Shortcut">
                <div class="pic new"><img src="Pics/add.png" alt="Add Logo"></div>
                <div class="span"><span>Add Shortcut</span></div>
            </div>
        </div>
    </main>
    <!-- Last button -->
    <footer>
        <button title="Customize this page">
            Customize Chrome
            <img src="Pics/pencil.png" alt="Edit logo">
        </button>
    </footer>
</body>

</html>
